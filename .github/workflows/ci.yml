name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable image from a clean checkout
        run: docker build --tag succession-ci .
      - name: Verify installed service and packaged contract data
        run: docker run --rm succession-ci python -c "from service.app import app; from succession.chain import load_artifact; assert app.routes; assert load_artifact('ListingContract')['abi']"
      - name: Verify container dependency compatibility
        run: docker run --rm succession-ci python -m pip check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Python suite executes the compiled contract bytecode through py-evm,
      # so the contracts have to be built before pytest runs.
      - name: Build contracts
        working-directory: contracts
        run: |
          npm install
          npm run build

      # The `test` extra declares every dependency the suite needs, so CI and a
      # contributor on a fresh clone install exactly the same set.
      - name: Install the package
        run: pip install -e "packages/succession[test,service,chain,mcp,acp]"

      - name: Check all integrations share compatible dependencies
        run: |
          pip check
          python -c "from virtuals_acp.client import VirtualsACP; from virtuals_acp.contract_clients.contract_client import ACPContractClient; from succession.mcp_server import build_server; assert build_server()"

      - name: Test
        run: pytest packages/succession/tests -p no:warnings

      # The command reference the app renders is generated from the argparse
      # parsers, so it is the same class of file as the contract ABI and needs
      # the same guard. A generated file edited by hand kept CI red for 27
      # commits before anyone noticed.
      - name: The generated command reference is current
        run: |
          python scripts/generate_reference.py
          git diff --exit-code -- web/src/app/reference.ts README.md \
            || (echo "::error::stale reference; run python scripts/generate_reference.py and commit" && exit 1)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend's contract ABI is generated from the compiled artifact, so
      # the contracts have to be built before it can be checked for staleness.
      - name: Build contracts
        working-directory: contracts
        run: |
          npm install
          npm run build

      - working-directory: web
        run: npm ci

      - name: Check the generated ABI is current
        working-directory: web
        run: |
          node scripts/generate-abi.mjs
          git diff --exit-code src/chain/abi.ts

      - working-directory: web
        run: npm run build

      - name: Install Chromium for browser regression checks
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser regression checks
        working-directory: web
        run: npm run test:browser

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # `--no-commit` was removed in Foundry 1.x, so this call had been failing
      # and `|| true` was swallowing it — forge-std never installed, and the
      # build that followed could not have compiled. Let it fail loudly instead.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts
      - name: Build and test
        working-directory: contracts
        run: |
          forge build
          forge test -vv

  # Installs the way a stranger would. The `test` job uses `pip install -e` and
  # pre-builds the ABI by hand, so it proves nothing about whether a published
  # wheel works: for a long time it did not, because the contract ABI resolved
  # by walking up from __file__ to a repo root that does not exist inside a
  # virtualenv.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile the contracts
        working-directory: contracts
        run: npm install && npm run build

      # The packaged ABI is tracked so `pip install git+https://…` works from a
      # clone, where contracts/out/ does not exist. Tracked means it can go
      # stale, so it is regenerated and compared, exactly as the frontend ABI is.
      - name: The shipped ABI matches the compiled one
        run: |
          cp contracts/out/artifacts.json packages/succession/src/succession/data/artifacts.json
          cp deployments/base-sepolia.json packages/succession/src/succession/data/base-sepolia.json
          git diff --exit-code -- packages/succession/src/succession/data \
            || (echo "::error::the shipped ABI or deployment record is stale; commit the regenerated files" && exit 1)

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist packages/succession

      - name: Install it somewhere else entirely
        run: |
          python -m venv /tmp/stranger
          /tmp/stranger/bin/pip install "$(ls dist/*.whl)[chain]"

      - name: The command exists, and reaches what it needs
        working-directory: /tmp
        run: |
          /tmp/stranger/bin/succession --help
          /tmp/stranger/bin/python -c "
          from succession.chain import load_artifact
          abi = load_artifact('ListingContract')['abi']
          assert abi, 'the ABI did not ship in the wheel'
          print(f'ABI loaded from site-packages: {len(abi)} entries')
          "

      - name: Every claim the project makes, from the installed package
        working-directory: /tmp
        run: /tmp/stranger/bin/succession audit
