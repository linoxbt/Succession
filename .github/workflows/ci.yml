name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Python suite executes the compiled contract bytecode through py-evm,
      # so the contracts have to be built before pytest runs.
      - name: Build contracts
        working-directory: contracts
        run: |
          npm install
          npm run build

      # The `test` extra declares every dependency the suite needs, so CI and a
      # contributor on a fresh clone install exactly the same set.
      - name: Install the package
        run: pip install -e "packages/succession[test,service,chain]"

      - name: Test
        run: pytest packages/succession/tests -p no:warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend's contract ABI is generated from the compiled artifact, so
      # the contracts have to be built before it can be checked for staleness.
      - name: Build contracts
        working-directory: contracts
        run: |
          npm install
          npm run build

      - working-directory: web
        run: npm ci

      # A hand-edited or stale ABI does not fail at build time — it fails as an
      # unexplained revert with a buyer's money in escrow. Regenerate and
      # insist nothing moved.
      - name: Check the generated ABI is current
        working-directory: web
        run: |
          node scripts/generate-abi.mjs
          git diff --exit-code src/chain/abi.ts

      - working-directory: web
        run: npm run build

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # `--no-commit` was removed in Foundry 1.x, so this call had been failing
      # and `|| true` was swallowing it — forge-std never installed, and the
      # build that followed could not have compiled. Let it fail loudly instead.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts
      - name: Build and test
        working-directory: contracts
        run: |
          forge build
          forge test -vv
