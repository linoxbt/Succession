[project]
name = "succession"
version = "0.1.0"
description = "The property layer for agent memory — SMP export/hash/import, provenance, valuation, sealing, and transfer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sibyl-memory-client>=0.8.0",
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
service = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
succession = "succession.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/succession"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
